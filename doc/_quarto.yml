# The website content in index.qmd is gated on this profile, so make it the
# default; the PDF build selects the book profile explicitly.
profile:
  default: website

project:
  type: website
  pre-render:
    - ./link_examples.sh
    - ./example_table.py
    - ./ug_pdf_download.sh
  # Copies the user guide PDF into the rendered site once it exists.
  post-render: ./ug_pdf_download.sh
  output-dir: ug
  render:
    - "*.qmd"
    - "content/*.qmd"
    - "examples/*/**/*.qmd"
    - "*.md"
    - "*.bib"
    # This directory's README, which exists for people browsing the repository
    # on GitLab and is not a page of the site.
    - "!README.md"
    # Internal design notes. They are untracked, so CI never sees them, but a
    # local render would otherwise turn them into pages of the site.
    - "!design/**"
    - "!code/*"
    - "!index_pdf.qmd"
    - "!abstract.qmd"
    - "!ug_pdf/**"

website:
  # Feeds the browser tab and the "... - OpenLB" suffix on every page. The
  # navbar shows the logo instead, so its own title is switched off below.
  title: "OpenLB"
  favicon: fig/openlb_favicon.png
  image: fig/openlb_small.png
  #author: "Johannes Grafen"
  #date: "4/12/2025"
  page-navigation: true
  reader-mode: true
  back-to-top-navigation: true

  navbar:
    title: false
    logo: "fig/openlb_full.png"
    logo-href: https://openlb.net
    tools:
      - icon: gitlab
        href: https://gitlab.com/openlb/release
      - icon: linkedin
        href: https://www.linkedin.com/groups/4356445/  
    left:
      - href: index.qmd
        text: Home
      - sidebar:documentation
      - href: examples/index_web.qmd
        text: Examples
      - href: content/11_step_by_step.qmd
