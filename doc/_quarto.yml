# Shared bibliography for all formats
bibliography: literature.bib

format:
  html:
    syntax-highlighting: arrow
    code-block-bg: true
    code-block-border-left: "#0f3165"
    page-layout: full
    theme:
      - cosmo
      #- brand
    css: styles.css
    toc: true
    number-sections: false
    link-external-icon: true
    link-external-newwindow: true
    # math: mathjax
    # macros:
    #   bm: "\\boldsymbol{#1}"
    #   OpenLB: "\\textit{\\sf OpenLB~#1}\\xspace"
    include-in-header: 
      # - sidebar_toggle.html
      - include/mathjax.html
      - include/table_style.html 
    # Generated by ug_pdf_download.sh: adds the PDF download tool to the
    # navbar, and is empty when no PDF has been built.
    include-after-body:
      - include/pdf_download.html
    other-links:
      - text: Examples Overview
        href: examples/index_web.html
      - text: Consortium
        href: mailto:consortium@openlb.net
      - text: Bug report
        href: mailto:bug@openlb.net

filters:
  - pseudocode

pseudocode:
  caption-prefix: "Algorithm"
  reference-prefix: "Algorithm"
  caption-number: true
